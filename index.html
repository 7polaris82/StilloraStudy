<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Stillora</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Quicksand:wght@300;500;700&family=Playfair+Display:wght@400;700&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:wght@300;600&family=Poppins:wght@400;700&family=DM+Sans:wght@400;700&family=Montserrat:wght@400;700&family=Outfit:wght@400;700&family=Raleway:wght@400;700&family=Lexend:wght@400;700&family=Josefin+Sans:wght@400;700&family=Nunito:wght@400;700&family=Comfortaa:wght@400;700&family=Fredoka:wght@400;700&family=Varela+Round&family=Lora:wght@400;700&family=EB+Garamond:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Merriweather:wght@400;700&family=DM+Serif+Display&family=Cinzel:wght@400;700&family=Abril+Fatface&family=Bebas+Neue&family=Orbitron:wght@400;700&family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--ac:#9be3a8;--ui:Inter,system-ui,sans-serif;--tf:Inter,system-ui,sans-serif;--g:rgba(20,28,24,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html,body{height:100%;margin:0}body{background:#0d1512;color:#fff;font:15px var(--ui);overflow:hidden}
#bg,#ov{position:fixed;inset:0;transition:background 1.2s,filter .6s}#bg{background-size:cover;background-position:center;transform:scale(1.08)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);transition:.2s}.ico:hover,.ico.on{background:rgba(255,255,255,.22);color:var(--ac)}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;z-index:3}
.logo{font:600 22px var(--tf);letter-spacing:.04em;display:flex;gap:8px;align-items:center}.logo i{width:12px;height:12px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.quote{max-width:300px;text-align:right;font-size:13px;opacity:.85;font-style:italic;cursor:pointer}
.view{position:fixed;inset:0;display:none;z-index:2}.view.on{display:block;animation:f .5s}@keyframes f{from{opacity:0}}
#focus.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.modes{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:30px;backdrop-filter:blur(8px)}.modes button{padding:8px 18px;border-radius:24px;opacity:.75}.modes .on{background:rgba(255,255,255,.2);opacity:1}
#time{font-family:var(--tf);font-size:calc(var(--ts,1)*clamp(80px,20vw,230px));font-weight:var(--tw,700);letter-spacing:var(--tl,0);line-height:1;text-shadow:0 4px 40px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.bar{width:min(420px,70vw);height:4px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s linear}
.ctl{display:flex;gap:14px;align-items:center}.main{padding:14px 44px;border-radius:40px;background:var(--ac);color:#10201a;font-weight:700;font-size:17px}.sm{padding:10px 18px;border-radius:30px;background:rgba(255,255,255,.12)}.sm:hover{background:rgba(255,255,255,.25)}
.ctxbtn{opacity:.85;font-size:14px;padding:6px 14px;border-radius:20px;background:rgba(0,0,0,.2)}
.dock{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:3;pointer-events:none}.dock>div{display:flex;gap:10px;pointer-events:auto}
.page{overflow:auto;padding:84px 24px 90px;background:rgba(8,14,12,.55);backdrop-filter:blur(14px)}.wrap{max-width:900px;margin:auto}
h2{font:600 28px var(--tf);margin:0 0 18px}h3{margin:22px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.card{background:var(--g);border-radius:16px;padding:14px 16px;margin:8px 0;backdrop-filter:blur(8px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.grow{flex:1!important;min-width:140px}
input,select,textarea{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 10px;min-width:0}select option{color:#000}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;opacity:.9}label.c{flex-direction:row;align-items:center;gap:8px;font-size:14px}
.item{display:flex;justify-content:space-between;gap:10px;cursor:pointer}.item:hover{background:rgba(255,255,255,.12)}.muted{opacity:.6;font-size:13px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.15)}.empty{padding:30px;text-align:center;opacity:.6}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat b{display:block;font:600 24px var(--tf)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.sw button{height:80px;border-radius:12px;background-size:cover;border:2px solid transparent;font-size:12px;text-shadow:0 1px 4px #000;display:flex;align-items:flex-end;padding:6px}.sw .on{border-color:var(--ac)}
dialog{background:#16211c;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:20px;width:min(440px,92vw)}dialog::backdrop{background:rgba(0,0,0,.55)}dialog form{display:flex;flex-direction:column;gap:10px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow:auto;padding-bottom:6px}.heat i{width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.08)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal button{aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.07);font-size:12px}.cal .has{background:color-mix(in srgb,var(--ac) 45%,transparent)}
#stats.page{overflow:hidden}#stats .wrap{max-width:1500px;height:100%;display:grid;grid-template-columns:1.05fr .85fr 1.35fr;gap:22px}.col{min-height:0;overflow:auto;padding-right:6px}#tabs{display:none;gap:6px}#tabs button{flex:1;padding:8px;border-radius:20px;background:rgba(255,255,255,.1)}#tabs .on{background:var(--ac);color:#10201a}
.sticky{position:sticky;top:0;z-index:1;background:rgba(14,22,19,.88);padding:2px 0 8px}.dh{display:flex;justify-content:space-between;margin:14px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}.he{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer}.he:hover{background:rgba(255,255,255,.1)}.he.abandoned{opacity:.6}.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}.hd{margin:0 0 6px 30px;padding:10px;border-radius:10px;background:rgba(255,255,255,.07);font-size:13px}.s-completed{background:#9be3a833}.s-interrupted{background:#ffc27a33}.s-abandoned{background:#ff8a8a33}
.cr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent}.cr:hover{background:rgba(255,255,255,.07)}.cr.on{border-color:var(--ac);background:rgba(255,255,255,.08)}.mt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mt>div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07)}.mt b{display:block;font:600 22px var(--tf)}.mt small{opacity:.8}.per{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.per button{padding:6px 11px;border-radius:16px;font-size:13px;opacity:.75}.per .on{background:var(--ac);color:#10201a;opacity:1}.br{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;cursor:pointer}.br .tr{flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}.br .tr i{display:block;height:100%}
@media(max-width:900px){#stats .wrap{display:flex;flex-direction:column;gap:12px}#tabs{display:flex}#stats .col{display:none;flex:1}#stats .wrap[data-t="1"] #c1,#stats .wrap[data-t="2"] #c2,#stats .wrap[data-t="3"] #c3{display:block}}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:20px;z-index:9;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
@media(max-width:600px){.quote{display:none}.main{padding:12px 34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="bg"></div><div id="ov"></div>
<div class="top"><div class="logo"><i></i>Stillora</div><div class="quote" id="quote" title="Click for another quote"></div></div>
<section class="view on" id="focus">
 <div class="modes" id="modes" role="tablist"></div>
 <button class="ctxbtn" id="ctxb" aria-label="Choose what to study"></button>
 <div id="time" aria-live="off">25:00</div><div class="bar"><i id="pb"></i></div>
 <div class="ctl"><button class="sm" id="reset" aria-label="Reset">↺ Reset</button><button class="main" id="go">Start</button><button class="sm" id="skip" aria-label="Skip">Skip ⏭</button></div>
 <div class="muted" id="goal"></div>
</section>
<section class="view page" id="history"><div class="wrap"></div></section>
<section class="view page" id="stats"><div class="wrap"></div></section>
<section class="view page" id="tasks"><div class="wrap"></div></section>
<section class="view page" id="themes"><div class="wrap"></div></section>
<section class="view page" id="settings"><div class="wrap"></div></section>
<section class="view page" id="music" style="background:none;backdrop-filter:none"><div class="wrap" style="max-width:420px;margin-left:auto"></div></section>
<nav class="dock"><div id="nav"></div><div><button class="ico" data-v="music" aria-label="Music" title="Music">♫</button><button class="ico" id="fs" aria-label="Fullscreen" title="Fullscreen">⛶</button></div></nav>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
let db;const mem={};
const idb=()=>new Promise(r=>{try{const q=indexedDB.open('focus-app',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const kget=k=>new Promise(r=>{if(!db)return r(mem[k]);const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()});
const kset=(k,v)=>{mem[k]=v;if(db)try{db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}};
/* ---------- state ---------- */
const THEMES={
'Enchanted Forest':{ac:'#9be3a8',ui:'Quicksand',tf:'Quicksand',bg:0,tw:700},
'Dark Academia':{ac:'#d9a86c',ui:'Cormorant Garamond',tf:'Playfair Display',bg:5,tw:400},
'Cozy Rain':{ac:'#8fc7e8',ui:'Quicksand',tf:'Inter',bg:3,tw:300},
'Botanical Dream':{ac:'#f2a7c3',ui:'Quicksand',tf:'Cormorant Garamond',bg:1,tw:600},
'Midnight Blue':{ac:'#8fa8ff',ui:'Inter',tf:'Inter',bg:6,tw:800},
'Minimalist Light':{ac:'#2f6f5e',ui:'Inter',tf:'Inter',bg:7,tw:300,light:1},
'Warm Sunset':{ac:'#ffc27a',ui:'Quicksand',tf:'Playfair Display',bg:4,tw:700},
'Monochrome Focus':{ac:'#ffffff',ui:'Inter',tf:'Space Mono',bg:8,tw:700}};
const BGS=[['Enchanted Forest','radial-gradient(ellipse at 70% 0,#ffe9a066,transparent 45%),radial-gradient(circle at 20% 80%,#3f8f5a88,transparent 50%),linear-gradient(160deg,#0f3b2a,#1f6b45 55%,#0b241a)'],
['Botanical Illustration','radial-gradient(circle at 30% 30%,#f6b8d088,transparent 40%),radial-gradient(circle at 80% 70%,#9bd9a888,transparent 45%),linear-gradient(135deg,#3b2a44,#6b4a6e)'],
['Wildflower Meadow','radial-gradient(circle at 50% 100%,#ffd86a99,transparent 50%),linear-gradient(180deg,#5aa6d6,#a8d9a0 70%,#4c9a55)'],
['Rainy Window','repeating-linear-gradient(100deg,#ffffff08 0 2px,transparent 2px 14px),linear-gradient(180deg,#27343f,#4b6372 60%,#1d2830)'],
['Warm Sunset','radial-gradient(circle at 50% 75%,#ffd36e,#ff8a4c 30%,transparent 60%),linear-gradient(180deg,#3a2a5c,#c2587a 60%,#ff9d5c)'],
['Cozy Library','radial-gradient(circle at 80% 30%,#ffb35e88,transparent 35%),repeating-linear-gradient(90deg,#2b1a12 0 38px,#3d2619 38px 44px,#4b2e1c 44px 70px)'],
['Night Sky','radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 20%,#fff,transparent),radial-gradient(2px 2px at 80% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),linear-gradient(180deg,#050b24,#16275e)'],
['Minimal Light','linear-gradient(135deg,#f4f1ea,#d8e4dc)'],
['Mountains','linear-gradient(180deg,#1b2a4a 0,#5a7ba6 45%,transparent 45%),linear-gradient(160deg,transparent 45%,#2c3e55 45%,#1a2738)'],
['Ocean','radial-gradient(circle at 50% 0,#aee9ff77,transparent 50%),linear-gradient(180deg,#0e5a7a,#073b57 60%,#021c2e)'],
['Abstract','conic-gradient(from 200deg at 30% 60%,#ff6b9d,#6b5bff,#27d3c5,#ff6b9d)']];
const QUOTES=['Small steps, every day.','Deep work is a superpower.','Be where your feet are.','Progress, not perfection.','One page at a time.','Quiet mind, steady hands.','You are building your future self.'];
const DEF={focus:25,short:5,long:15,every:4,autoBreak:true,autoStart:false,tick:false,chime:true,notif:false,quote:true,qi:0,theme:'Enchanted Forest',bg:0,custom:null,tf:'Quicksand',ui:'Quicksand',tstyle:'',ts:1,tw:700,tl:0,blur:0,bright:100,contrast:100,dim:35,shuffle:false,favs:[],modeBg:{},goalD:120,goalW:600,lists:[],ac:'#9be3a8'};
let S={...DEF},H=[],TK=[],SUBJ=[],CAT=[],T,view='focus',ctx={},uiTimer;
const fresh=(mode='focus')=>({mode,running:false,seg:0,acc:0,start:0,planned:(S[mode]||25)*60,ctx:{...ctx},done:0,id:0});
const persist=()=>{kset('S',S);kset('H',H);kset('TK',TK);kset('SUBJ',SUBJ);kset('CAT',CAT);kset('T',T)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(t._);t._=setTimeout(()=>t.className='',2200)};
/* ---------- timer ---------- */
const elapsed=()=>T.acc+(T.running?Date.now()-T.seg:0);
const rem=()=>Math.max(0,T.planned*1000-elapsed());
function fmt(ms){const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){if(T.running)return;if(!T.start)T.start=Date.now();T.seg=Date.now();T.running=true;persist();loop();draw()}
function pause(){if(!T.running)return;T.acc+=Date.now()-T.seg;T.running=false;persist();draw()}
function record(status,endAt){const a=Math.round(Math.min(elapsed(),T.planned*1000+1)/1000);if(a<3&&status!=='completed')return null;
 const r={id:'s'+Date.now()+Math.random().toString(36).slice(2,6),type:T.mode,start:T.start||Date.now(),end:endAt||Date.now(),planned:T.planned,actual:Math.min(a,T.mode==='focus'&&status==='completed'?T.planned:a),status,subject:T.ctx.subject||'',topic:T.ctx.topic||'',task:T.ctx.task||'',project:T.ctx.project||'',notes:'',taskDone:false};H.push(r);return r}
function finish(status,auto){const wasRun=T.running;if(wasRun){T.acc+=Date.now()-T.seg;T.running=false}
 const endAt=status==='completed'?T.start+T.acc+0:Date.now();const r=record(status,status==='completed'?Math.max(T.start,Date.now()):endAt);
 const mode=T.mode;let n=H.filter(x=>x.type==='focus'&&x.status==='completed'&&new Date(x.start).toDateString()===new Date().toDateString()).length;
 let next=mode==='focus'?(status==='completed'&&S.autoBreak||status!=='completed'&&false?((S.every&&n%S.every===0&&n>0)?'long':'short'):'focus'):'focus';
 const keep={...ctx};T=fresh(next);T.ctx=keep;persist();draw();
 if(status==='completed'){ding();notify(mode==='focus'?'Focus session complete':'Break over');if(mode==='focus'&&r)summary(r)}
 if(auto&&S.autoStart)start()}
function loop(){clearInterval(uiTimer);uiTimer=setInterval(()=>{if(T.running&&rem()<=0)finish('completed',true);draw(true)},250)}
function draw(light){const m=T.running||T.acc?rem():T.planned*1000;$('#time').textContent=fmt(m);document.title=(T.running?fmt(m)+' · ':'')+'Stillora';
 $('#pb').style.width=(100*(1-m/(T.planned*1000)))+'%';$('#go').textContent=T.running?'Pause':(T.acc?'Resume':'Start');if(light)return;
 $('#modes').innerHTML=[['focus','Focus'],['short','Short Break'],['long','Long Break']].map(([k,l])=>`<button class="${T.mode===k?'on':''}" data-m="${k}" role="tab">${l}</button>`).join('');
 const c=T.ctx;$('#ctxb').textContent=T.mode==='focus'?('✎ '+([c.subject,c.topic,c.task].filter(Boolean).join(' · ')||'What are you studying? (optional)')):'☕ Taking a break';
 const today=H.filter(x=>x.type==='focus'&&sameDay(x.start,Date.now())).reduce((a,x)=>a+x.actual,0);$('#goal').textContent=`Today ${Math.floor(today/60)} / ${S.goalD} min`;applyBg()}
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
function ding(){if(!S.chime)return;try{const a=new AudioContext();[660,880,990].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);const t=a.currentTime+i*.22;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.start(t);o.stop(t+.6)})}catch(e){}}
function notify(t){if(S.notif&&'Notification'in window&&Notification.permission==='granted')new Notification('Stillora',{body:t});toast(t)}
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(!m||m===T.mode)return;if(T.acc||T.running)if(!confirm('Switch mode? The current session will be saved as interrupted.'))return;else finish('interrupted');const k={...ctx};T=fresh(m);T.ctx=k;persist();draw()};
$('#go').onclick=()=>T.running?pause():start();
$('#reset').onclick=()=>{if(T.acc||T.running){if(!confirm('Reset this session? It will be logged as abandoned.'))return;finish('abandoned')}else{T.planned=S[T.mode]*60;draw()}};
$('#skip').onclick=()=>{if(T.acc||T.running){finish('interrupted')}else{const k={...ctx};T=fresh(T.mode==='focus'?'short':'focus');T.ctx=k;persist();draw()}};
setInterval(()=>{},1e9);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.running&&rem()<=0)finish('completed',true)});
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$('#dlg').open)return;if(e.code==='Space'&&view==='focus'){e.preventDefault();$('#go').click()}});
/* ---------- dialogs ---------- */
function dlg(html,onsubmit){const d=$('#dlg');d.innerHTML='<form method="dialog">'+html+'</form>';d.showModal();d.querySelector('form').onsubmit=e=>{const b=e.submitter?.value;if(b==='x')return;const f=Object.fromEntries(new FormData(e.target));e.target.querySelectorAll('input[type=checkbox]').forEach(c=>f[c.name]=c.checked);onsubmit&&onsubmit(f,b)}}
const subjOpts=sel=>`<datalist id="sl">${SUBJ.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`;
function pickCtx(){const c=T.ctx;dlg(`<h2 style="font-size:20px">What are you studying?</h2>${subjOpts()}
<label>Subject<input name="subject" list="sl" value="${esc(c.subject)}" placeholder="e.g. Mathematics"></label><label>Topic / chapter<input name="topic" value="${esc(c.topic)}"></label>
<label>Task<input name="task" value="${esc(c.task)}" list="tl"></label><datalist id="tl">${TK.filter(t=>!t.done).map(t=>`<option value="${esc(t.text)}">`).join('')}</datalist><label>Project / category<input name="project" value="${esc(c.project)}"></label>
<div class="row"><button class="sm" value="clear">Clear</button><span class="grow"></span><button class="sm" value="x">Cancel</button><button class="main" style="padding:10px 24px" value="ok">Save</button></div>`,(f,b)=>{ctx=b==='clear'?{}:{subject:f.subject.trim(),topic:f.topic.trim(),task:f.task.trim(),project:f.project.trim()};if(ctx.subject&&!SUBJ.includes(ctx.subject))SUBJ.push(ctx.subject);T.ctx={...ctx};persist();draw()})}
$('#ctxb').onclick=()=>T.mode==='focus'&&pickCtx();
function summary(r){dlg(`<h2 style="font-size:20px">Session complete 🌿</h2><div class="muted">${Math.round(r.actual/60)} min of focused time recorded</div>${subjOpts()}
<label>Subject<input name="subject" list="sl" value="${esc(r.subject)}"></label><label>Topic<input name="topic" value="${esc(r.topic)}"></label><label>Task<input name="task" value="${esc(r.task)}"></label>
<label>Notes<textarea name="notes" rows="3"></textarea></label><label class="c"><input type="checkbox" name="taskDone"> Mark task as completed</label>
<div class="row"><span class="grow"></span><button class="main" style="padding:10px 24px" value="ok">Save</button></div>`,f=>{Object.assign(r,{subject:f.subject.trim(),topic:f.topic.trim(),task:f.task.trim(),notes:f.notes,taskDone:f.taskDone});if(r.subject&&!SUBJ.includes(r.subject))SUBJ.push(r.subject);if(f.taskDone){const t=TK.find(t=>t.text===r.task);if(t)t.done=true}persist()})}

function renderSettings(){const w=W('settings'),n=(k,l,mn,mx)=>`<label>${l}<input type="number" data-n="${k}" min="${mn}" max="${mx}" value="${S[k]}" style="width:90px"></label>`,c=(k,l)=>`<label class="c"><input type="checkbox" data-c="${k}" ${S[k]?'checked':''}> ${l}</label>`;
 w.innerHTML=`<h2>Settings</h2><h3>Presets</h3><div class="row">${[[25,5,15],[50,10,20],[90,15,30]].map(p=>`<button class="sm" data-p="${p}">${p[0]}/${p[1]}</button>`).join('')}</div>
<div class="card row">${n('focus','Focus (min)',1,240)}${n('short','Short break',1,60)}${n('long','Long break',1,90)}${n('every','Long break every N sessions',1,12)}${n('goalD','Daily goal (min)',10,1000)}${n('goalW','Weekly goal (min)',10,5000)}</div>
<div class="card">${c('autoBreak','Switch to a break after focus')}${c('autoStart','Auto-start next session')}${c('chime','Completion sound')}${c('quote','Show motivational quote')}<label class="c"><input type="checkbox" id="nt" ${S.notif?'checked':''}> Desktop notifications</label></div>
<h3>Data</h3><div class="row"><button class="sm" id="ej">Export JSON backup</button><button class="sm" id="ec">Export CSV</button><label class="sm" style="cursor:pointer">Restore backup<input type="file" id="imp" accept=".json" hidden></label><button class="sm" id="wipe" style="color:#ff8a8a">Erase all data</button></div><p class="muted">All data stays in this browser (IndexedDB). Back up regularly — clearing site data deletes it.</p>`;
 w.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const[f,s,l]=b.dataset.p.split(',').map(Number);Object.assign(S,{focus:f,short:s,long:l});sync();renderSettings()});
 w.querySelectorAll('[data-n]').forEach(i=>i.onchange=()=>{S[i.dataset.n]=Math.max(+i.min,Math.min(+i.max,+i.value||+i.min));sync()});w.querySelectorAll('[data-c]').forEach(i=>i.onchange=()=>{S[i.dataset.c]=i.checked;persist();applyBg()});
 w.querySelector('#nt').onchange=async e=>{if(e.target.checked&&'Notification'in window){const p=await Notification.requestPermission();S.notif=p==='granted';if(!S.notif){e.target.checked=false;toast('Notifications blocked by browser')}}else S.notif=false;persist()};
 const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
 w.querySelector('#ej').onclick=()=>dl('stillora-backup.json',JSON.stringify({S,H,TK,SUBJ,CAT}),'application/json');
 w.querySelector('#ec').onclick=()=>dl('stillora-history.csv','date,start,end,type,minutes,status,subject,topic,task,notes\n'+H.map(x=>[new Date(x.start).toLocaleDateString('en-CA'),new Date(x.start).toISOString(),new Date(x.end).toISOString(),x.type,(x.actual/60).toFixed(2),x.status,x.subject,x.topic,x.task,x.notes].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
 w.querySelector('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.H))throw 0;if(!confirm(`Restore ${d.H.length} records? This replaces current data.`))return;S={...DEF,...d.S};H=d.H;TK=d.TK||[];SUBJ=d.SUBJ||[];CAT=d.CAT||[];T=fresh();persist();applyBg();draw();renderSettings();toast('Backup restored')}catch(x){toast('That file is not a valid backup')}})};
 w.querySelector('#wipe').onclick=()=>{if(confirm('Erase ALL sessions, tasks and settings? This cannot be undone.')){S={...DEF};H=[];TK=[];SUBJ=[];CAT=[];ctx={};T=fresh();persist();applyBg();draw();renderSettings()}}}
function sync(){if(!T.running&&!T.acc)T.planned=S[T.mode]*60;persist();draw()}
/* ---------- music (Amazon Music has no public web playback API: links only) ---------- */
function renderMusic(){const w=W('music');w.innerHTML=`<div class="card" style="background:rgba(10,16,14,.8)"><b>♫ Amazon Music</b><p class="muted">Amazon doesn't offer a public web playback SDK, so playback happens in Amazon Music itself. Open it in a new tab or the app and keep studying here. No credentials are ever requested by Focus.</p>
<div class="row"><a class="sm" style="text-decoration:none;color:#fff" href="https://music.amazon.com" target="_blank" rel="noopener">Open Amazon Music ↗</a></div><h3>Saved study playlists</h3>
${S.lists.length?S.lists.map((l,i)=>`<div class="row" style="margin:6px 0"><a class="grow" style="color:var(--ac)" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>${l.theme?`<span class="tag">${esc(l.theme)}</span>`:''}<button class="sm" data-d="${i}" aria-label="Remove">✕</button></div>`).join(''):'<div class="muted">None saved yet.</div>'}
<h3>Add a playlist</h3><div class="row"><input id="pn" placeholder="Name" class="grow"><input id="pu" placeholder="https://music.amazon.com/playlists/…" class="grow"><select id="pt"><option value="">Any theme</option>${Object.keys(THEMES).map(t=>`<option>${t}</option>`).join('')}</select><button class="sm" id="pa">Save</button></div></div>`;
 w.querySelector('#pa').onclick=()=>{const name=w.querySelector('#pn').value.trim(),url=w.querySelector('#pu').value.trim();if(!name||!/^https:\/\/([\w-]+\.)?amazon\.[a-z.]+\//i.test(url))return toast('Enter a name and an https://music.amazon.… link');S.lists.push({name,url,theme:w.querySelector('#pt').value});persist();renderMusic()};
 w.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.lists.splice(+b.dataset.d,1);persist();renderMusic()})}
/* ---------- init ---------- */
(async()=>{await idb();const[s,h,tk,sj,t,cat]=await Promise.all(['S','H','TK','SUBJ','T','CAT'].map(kget));CAT=cat||[];S={...DEF,...s};H=h||[];TK=tk||[];SUBJ=sj||[];T=t&&t.planned?t:fresh();ctx={...T.ctx};
 if(T.running&&rem()<=0){const end=T.start+0;T.acc=T.planned*1000;T.running=false;const r=record('completed',Date.now());T=fresh(T.mode==='focus'?(S.autoBreak?'short':'focus'):'focus');persist();if(r){toast('A session finished while you were away');if(r.type==='focus')setTimeout(()=>summary(r),600)}}
 else if(T.running)loop();
 if(S.shuffle&&!T.running&&!T.acc)S.bg=Math.floor(Math.random()*BGS.length);
 draw();loop();go('focus')})();
</script></body></html>
